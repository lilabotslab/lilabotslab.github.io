<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria zdjęć</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
body{min-height:100vh;display:flex;flex-direction:column}
.gallery{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:16px}
.photo-wrap{width:100%;height:calc(100vh - 145px);display:flex;align-items:center;justify-content:center}
#photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
button{border:0;border-radius:30px;padding:13px 22px;background:#f2a8cf;color:#382033;font-size:1rem;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid white;outline-offset:4px}
#count{min-width:55px;text-align:center;font-weight:700;font-size:1.1rem}
@media(max-width:600px){.gallery{padding:10px;gap:12px}.photo-wrap{height:calc(100vh - 125px)}button{padding:12px 17px}}
</style>
</head>
<body>
<main class="gallery" aria-label="Prezentacja zdjęć">
<div class="photo-wrap"><img id="photo" src="IMG_1217.png" alt="Zdjęcie 1 z 5"></div>
<div class="controls">
<button id="previous" type="button" aria-label="Poprzednie zdjęcie">⬅ Poprzednie</button>
<span id="count" aria-live="polite">1 / 5</span>
<button id="next" type="button" aria-label="Następne zdjęcie">Następne ➜</button>
</div>
</main>
<script>
(()=>{const images=['IMG_1217.png','IMG_1218.png','IMG_1219.png','IMG_1220.png','IMG_1221.png'];let index=0;
const photo=document.getElementById('photo'),count=document.getElementById('count');
function show(){photo.src=images[index];photo.alt='Zdjęcie '+(index+1)+' z '+images.length;count.textContent=(index+1)+' / '+images.length}
function move(step){index=(index+step+images.length)%images.length;show()}
document.getElementById('previous').addEventListener('click',()=>move(-1));
document.getElementById('next').addEventListener('click',()=>move(1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
})();
</script>
</body>
</html>
