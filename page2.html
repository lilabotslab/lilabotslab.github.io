<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magiczna strona</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: Arial, sans-serif; text-align: center; color: #49345a; background: linear-gradient(135deg, #fff0fb, #e9f9ff); }
    main { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0; }
    img { display: block; width: min(85vw, 420px); max-height: 55vh; object-fit: contain; }
    a { border-radius: 999px; padding: 13px 20px; background: #159e9e; color: white; font-size: 1rem; font-weight: 700; text-decoration: none; }
    a:hover { background: #117f82; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Magiczna strona ✨</h1>
    <p id="description">Tutaj mieszka jednorożec!</p>
    <img src="https://img2.clipart-library.com/26/transparent-unicorn-clipart/transparent-unicorn-clipart-12.jpg" alt="Kolorowy jednorożec z tęczową grzywą">
    <a id="back" href="index.html">⬅ Wróć do powitań</a>
    <small>Ilustracja: <a href="https://clipart-library.com/clipart/transparent-unicorn-clipart-12.htm" target="_blank" rel="noopener noreferrer">Clipart Library</a></small>
  </main>
  <script>
    const translations = [
      { code:'pl', title:'Magiczna strona', heading:'Magiczna strona ✨', description:'Tutaj mieszka jednorożec!', back:'⬅ Wróć do powitań' },
      { code:'en', title:'Magic page', heading:'Magic page ✨', description:'A unicorn lives here!', back:'⬅ Back to greetings' },
      { code:'de', title:'Zauberseite', heading:'Zauberseite ✨', description:'Hier wohnt ein Einhorn!', back:'⬅ Zurück zu den Grüßen' },
      { code:'fr', title:'Page magique', heading:'Page magique ✨', description:'Une licorne habite ici !', back:'⬅ Retour aux salutations' },
      { code:'es', title:'Página mágica', heading:'Página mágica ✨', description:'¡Aquí vive un unicornio!', back:'⬅ Volver a los saludos' },
      { code:'it', title:'Pagina magica', heading:'Pagina magica ✨', description:'Qui vive un unicorno!', back:'⬅ Torna ai saluti' }
    ];
    const saved = Number(localStorage.getItem('lilabotslab-language') || 0);
    const t = translations[Number.isInteger(saved) && saved >= 0 && saved < translations.length ? saved : 0];
    document.documentElement.lang = t.code;
    document.title = t.title;
    document.getElementById('heading').textContent = t.heading;
    document.getElementById('description').textContent = t.description;
    document.getElementById('back').textContent = t.back;
  </script>
</body>
</html>
