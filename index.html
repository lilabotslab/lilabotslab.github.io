<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiszki angielskie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Fiszki angielskie 🇬🇧</h1>
    <p class="instruction">Kliknij fiszkę, aby zobaczyć tłumaczenie.</p>

    <section class="cards" aria-label="Fiszki ze słówkami">
      <button class="card" type="button" onclick="this.classList.toggle('flipped')" aria-label="Fiszka: dom">
        <span class="card-inner">
          <span class="card-front">dom</span>
          <span class="card-back">house</span>
        </span>
      </button>

      <button class="card" type="button" onclick="this.classList.toggle('flipped')" aria-label="Fiszka: krzesło">
        <span class="card-inner">
          <span class="card-front">krzesło</span>
          <span class="card-back">chair</span>
        </span>
      </button>

      <button class="card" type="button" onclick="this.classList.toggle('flipped')" aria-label="Fiszka: stół">
        <span class="card-inner">
          <span class="card-front">stół</span>
          <span class="card-back">table</span>
        </span>
      </button>
    </section>
  </main>
</body>
</html>
