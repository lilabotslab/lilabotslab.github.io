<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiszki angielskie i tańczący jednorożec</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#111;padding:24px}.app{width:min(92vw,650px);margin:auto;text-align:center}h1{font-size:clamp(1.7rem,5vw,2.5rem);margin:0 0 8px}.sub{color:#666;margin:0 0 18px}.unicorn-stage{height:220px;margin:0 auto 28px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(180deg,#24104d,#7c2f91 60%,#e45bb4);box-shadow:0 18px 50px #0002}.stars{position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,#fff 0 2px,transparent 3px),radial-gradient(circle at 80% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 55% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 30% 65%,#fff 0 1px,transparent 2px)}.floor{position:absolute;left:-10%;right:-10%;bottom:-50px;height:90px;background:radial-gradient(ellipse,#ffb6ec88,transparent 65%);border-radius:50%}.unicorn{position:absolute;left:50%;bottom:35px;font-size:105px;transform:translateX(-50%);filter:drop-shadow(0 10px 10px #0004);animation:dance .7s ease-in-out infinite alternate}.spark{position:absolute;font-size:24px;animation:spark 1.2s ease-in-out infinite alternate}.s1{left:18%;top:35%}.s2{right:18%;top:45%;animation-delay:.4s}@keyframes dance{0%{transform:translateX(-50%) rotate(-8deg) translateY(5px) scaleX(.96)}50%{transform:translateX(-50%) rotate(0) translateY(-12px) scaleX(1.04)}100%{transform:translateX(-50%) rotate(8deg) translateY(2px) scaleX(.96)}}@keyframes spark{from{transform:scale(.7) rotate(0);opacity:.5}to{transform:scale(1.2) rotate(20deg);opacity:1}}.dance-title{position:absolute;top:12px;left:0;right:0;color:#fff;font-weight:700;font-size:1.15rem}.card{height:360px;perspective:1000px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;background:#fff;border-radius:28px;box-shadow:0 18px 50px #0002;display:grid;place-items:center;padding:30px;backface-visibility:hidden}.front{font-size:clamp(2rem,8vw,4rem);font-weight:700}.back{transform:rotateY(180deg);background:#111;color:#fff;display:flex;flex-direction:column;gap:10px}.backWord{font-size:clamp(2rem,8vw,3.5rem);font-weight:700}.hint{color:#777;margin:16px}.controls{display:flex;justify-content:center;gap:12px}button{border:0;border-radius:12px;padding:11px 20px;font-size:1rem;background:#fff;box-shadow:0 4px 15px #0001;cursor:pointer}.progress{margin-top:14px;color:#777;font-size:.9rem}@media(max-width:600px){body{padding:12px}.card{height:280px}.unicorn-stage{height:190px}.unicorn{font-size:85px}}</style></head>
<body><main class="app"><h1>Fiszki angielskie</h1><p class="sub">Polsko-angielskie słówka szkolne</p><section class="unicorn-stage" aria-label="Tańczący jednorożec"><div class="dance-title">🦄 Tańczący jednorożec ✨</div><div class="stars"></div><div class="spark s1">✨</div><div class="spark s2">⭐</div><div class="floor"></div><div class="unicorn">🦄</div></section><div class="card" id="card" tabindex="0"><div class="inner"><div class="face front" id="front"></div><div class="face back"><div class="backWord" id="en"></div></div></div></div><p class="hint">Kliknij fiszkę, aby zobaczyć angielskie słowo</p><div class="controls"><button id="prev">← Poprzednia</button><button id="next">Następna →</button></div><div class="progress" id="progress"></div></main>
<script>const words=[['nauczyciel','teacher'],['spodnie','trousers'],['koszulka','T-shirt'],['budynek szkoły','school building'],['biblioteka','library'],['szkoła','school'],['sala gimnastyczna','gym'],['ludzie','people'],['uczeń','student'],['but','shoe'],['pracownia komputerowa','computer room'],['sweter','jumper'],['wstążka','ribbon'],['klasa','class'],['przerwa','break'],['spódnica','skirt'],['krawat','tie'],['dyrektor szkoły','headmaster'],['mundurek szkolny','school uniform'],['klub','club'],['boisko szkolne','schoolyard'],['koszula','shirt'],['plan lekcji','timetable'],['korytarz','hallway'],['kuchnia','kitchen']];let i=0;const card=document.getElementById('card'),front=document.getElementById('front'),en=document.getElementById('en'),progress=document.getElementById('progress');function render(){front.textContent=words[i][0];en.textContent=words[i][1];progress.textContent=`${i+1} / ${words.length}`;card.classList.remove('flip')}function flip(){card.classList.toggle('flip')}function next(){i=(i+1)%words.length;render()}function prev(){i=(i-1+words.length)%words.length;render()}card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.onkeydown=e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()};render();</script></body></html>
