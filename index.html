<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Układ okresowy pierwiastków</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#111;padding:24px}h1{text-align:center;font-size:clamp(1.5rem,4vw,2.4rem);margin:10px 0 8px}.sub{text-align:center;color:#666;margin:0 0 24px}.table{display:grid;grid-template-columns:repeat(18,minmax(48px,1fr));gap:6px;max-width:1500px;margin:auto}.el{min-height:76px;border:1px solid #bbb;border-radius:10px;background:white;padding:7px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;justify-content:space-between}.el:hover{transform:translateY(-2px);box-shadow:0 5px 14px #0002}.num{font-size:.72rem;color:#666}.sym{text-align:center;font-size:1.45rem;font-weight:700}.name{text-align:center;font-size:.68rem}.empty{visibility:hidden}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px}.modal.show{display:grid}.box{background:white;border-radius:20px;padding:28px;text-align:center;width:min(92vw,420px);box-shadow:0 20px 60px #0005}.big{font-size:4rem;font-weight:700;margin:4px}.box h2{margin:8px 0;font-size:1.7rem}.box p{color:#555}.close{border:0;background:#111;color:white;border-radius:10px;padding:10px 20px;cursor:pointer;font-size:1rem}@media(max-width:800px){body{padding:10px}.table{grid-template-columns:repeat(18,48px);overflow-x:auto;padding-bottom:12px}.el{min-height:70px}.sub{font-size:.9rem}}
</style>
</head>
<body>
<h1>Układ okresowy pierwiastków</h1>
<p class="sub">Kliknij dowolny pierwiastek, aby zobaczyć informacje.</p>
<div class="table" id="table"></div>
<div class="modal" id="modal"><div class="box"><div class="big" id="msym"></div><h2 id="mname"></h2><p id="minfo"></p><button class="close" onclick="closeModal()">Zamknij</button></div></div>
<script>
const elements=[
[1,'H','Wodór',1,1],[2,'He','Hel',1,18],[3,'Li','Lit',2,1],[4,'Be','Beryl',2,2],[5,'B','Bor',2,13],[6,'C','Węgiel',2,14],[7,'N','Azot',2,15],[8,'O','Tlen',2,16],[9,'F','Fluor',2,17],[10,'Ne','Neon',2,18],[11,'Na','Sód',3,1],[12,'Mg','Magnez',3,2],[13,'Al','Glin',3,13],[14,'Si','Krzem',3,14],[15,'P','Fosfor',3,15],[16,'S','Siarka',3,16],[17,'Cl','Chlor',3,17],[18,'Ar','Argon',3,18],[19,'K','Potas',4,1],[20,'Ca','Wapń',4,2],[21,'Sc','Skand',4,3],[22,'Ti','Tytan',4,4],[23,'V','Wanad',4,5],[24,'Cr','Chrom',4,6],[25,'Mn','Mangan',4,7],[26,'Fe','Żelazo',4,8],[27,'Co','Kobalt',4,9],[28,'Ni','Nikiel',4,10],[29,'Cu','Miedź',4,11],[30,'Zn','Cynk',4,12],[31,'Ga','Gal',4,13],[32,'Ge','German',4,14],[33,'As','Arsen',4,15],[34,'Se','Selen',4,16],[35,'Br','Brom',4,17],[36,'Kr','Krypton',4,18],[37,'Rb','Rubid',5,1],[38,'Sr','Stront',5,2],[39,'Y','Itr',5,3],[40,'Zr','Cyrkon',5,4],[41,'Nb','Niob',5,5],[42,'Mo','Molibden',5,6],[43,'Tc','Technet',5,7],[44,'Ru','Ruten',5,8],[45,'Rh','Rod',5,9],[46,'Pd','Pallad',5,10],[47,'Ag','Srebro',5,11],[48,'Cd','Kadm',5,12],[49,'In','Ind',5,13],[50,'Sn','Cyna',5,14],[51,'Sb','Antymon',5,15],[52,'Te','Tellur',5,16],[53,'I','Jod',5,17],[54,'Xe','Ksenon',5,18],[55,'Cs','Cez',6,1],[56,'Ba','Bar',6,2],[57,'La','Lantan',6,3],[72,'Hf','Hafn',6,4],[73,'Ta','Tantal',6,5],[74,'W','Wolfram',6,6],[75,'Re','Ren',6,7],[76,'Os','Osm',6,8],[77,'Ir','Iryd',6,9],[78,'Pt','Platyna',6,10],[79,'Au','Złoto',6,11],[80,'Hg','Rtęć',6,12],[81,'Tl','Tal',6,13],[82,'Pb','Ołów',6,14],[83,'Bi','Bizmut',6,15],[84,'Po','Polon',6,16],[85,'At','Astat',6,17],[86,'Rn','Radon',6,18],[87,'Fr','Frans',7,1],[88,'Ra','Rad',7,2],[89,'Ac','Aktyn',7,3],[104,'Rf','Rutherford',7,4],[105,'Db','Dubn',7,5],[106,'Sg','Seaborg',7,6],[107,'Bh','Bohr',7,7],[108,'Hs','Has',7,8],[109,'Mt','Meitner',7,9],[110,'Ds','Darmsztadt',7,10],[111,'Rg','Roentgen',7,11],[112,'Cn','Kopernik',7,12],[113,'Nh','Nihon',7,13],[114,'Fl','Flerow',7,14],[115,'Mc','Moskow',7,15],[116,'Lv','Liwermor',7,16],[117,'Ts','Tenes',7,17],[118,'Og','Oganeson',7,18],[58,'Ce','Cer',8,4],[59,'Pr','Prazeodym',8,5],[60,'Nd','Neodym',8,6],[61,'Pm','Promet',8,7],[62,'Sm','Samar',8,8],[63,'Eu','Europ',8,9],[64,'Gd','Gadolin',8,10],[65,'Tb','Terb',8,11],[66,'Dy','Dysproz',8,12],[67,'Ho','Holm',8,13],[68,'Er','Erb',8,14],[69,'Tm','Tul',8,15],[70,'Yb','Iterb',8,16],[71,'Lu','Lutet',8,17],[90,'Th','Tor',9,4],[91,'Pa','Protaktyn',9,5],[92,'U','Uran',9,6],[93,'Np','Neptun',9,7],[94,'Pu','Pluton',9,8],[95,'Am','Ameryk',9,9],[96,'Cm','Kiur',9,10],[97,'Bk','Berkeley',9,11],[98,'Cf','Kaliforn',9,12],[99,'Es','Einstein',9,13],[100,'Fm','Ferm',9,14],[101,'Md','Mendelew',9,15],[102,'No','Nobel',9,16],[103,'Lr','Lorens',9,17]];
const table=document.getElementById('table');
const pos=new Map(elements.map(e=>[e[0],e]));
for(let r=1;r<=9;r++)for(let c=1;c<=18;c++){const e=[...pos.values()].find(x=>x[3]===r&&x[4]===c);if(e)table.appendChild(card(e));else{const d=document.createElement('div');d.className='empty';table.appendChild(d)}}
function card(e){const d=document.createElement('div');d.className='el';d.innerHTML=`<span class="num">${e[0]}</span><span class="sym">${e[1]}</span><span class="name">${e[2]}</span>`;d.onclick=()=>openModal(e);return d}
function openModal(e){msym.textContent=e[1];mname.textContent=e[2];minfo.textContent=`Liczba atomowa: ${e[0]}`;modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)closeModal()};
</script>
</body></html>
