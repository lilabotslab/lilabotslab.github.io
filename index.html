<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Powitania świata</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: Arial, sans-serif; text-align: center; color: #49345a; background: linear-gradient(135deg, #fff0fb, #e9f9ff); }
    main { width: 100%; min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px 18px; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.5rem); }
    .greeting-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; }
    #greeting { margin: 0; min-width: 120px; font-size: clamp(2.5rem, 8vw, 4rem); color: #159e9e; }
    button { border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer; background: #159e9e; color: white; font-size: 1rem; font-weight: 700; box-shadow: 0 4px 12px #159e9e35; }
    button:hover { background: #117f82; }
    button:focus-visible { outline: 3px solid #653477; outline-offset: 4px; }
    #language { margin: 0; color: #765783; font-size: 1rem; }
    #language-table { width: min(100%, 520px); border-collapse: collapse; background: #ffffffdf; border-radius: 14px; overflow: hidden; }
    #language-table th, #language-table td { padding: 12px; border-bottom: 1px solid #ead8ed; }
    #language-table th { background: #dff6f4; }
    #language-table tr:last-child td { border-bottom: 0; }
    #language-table td:last-child { text-align: right; }
    .choose-button { padding: 9px 15px; font-size: .9rem; }
    [hidden] { display: none !important; }
    .book-scene { width: min(100%, 720px); perspective: 1400px; }
    .page-card { position: relative; width: 100%; min-height: 470px; transform-style: preserve-3d; transition: transform .85s cubic-bezier(.2,.7,.2,1); }
    .page-card.flipped { transform: rotateY(180deg); }
    .page-face { position: absolute; inset: 0; min-height: 470px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; border: 2px solid #ead8ed; border-radius: 20px; background: #ffffffd9; box-shadow: 0 14px 35px #49345a20; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: auto; }
    .page-back { transform: rotateY(180deg); background: linear-gradient(145deg, #fff9ff, #e4fbfa); gap: 18px; }
    .unicorn { display: block; width: min(65%, 270px); max-height: 190px; object-fit: contain; }
    .turn-control { position: absolute; bottom: 18px; z-index: 2; }
    .turn-forward { right: 18px; }
    .turn-back { left: 18px; }
    footer { width: 100%; padding: 18px; margin-top: 18px; background: #ffffffb8; border-top: 1px solid #ead8ed; }
    @media (prefers-reduced-motion: reduce) { .page-card { transition: none; } }
  </style>
</head>
<body>
  <div class="book-scene">
    <div class="page-card" id="page-card">
      <section class="page-face page-front" aria-label="Przód kartki">
        <main>
          <h1 id="page-title">Powitania świata</h1>
          <div class="greeting-row">
            <h2 id="greeting" aria-live="polite">Hej!</h2>
            <button id="change-language" type="button" aria-expanded="false" aria-controls="language-table">Zmień język 🌍</button>
          </div>
          <p id="language">Wybrany język: Polski 🇵🇱</p>
          <table id="language-table" hidden>
            <thead><tr><th id="table-language">Język</th><th id="table-greeting">Powitanie</th><th id="table-action">Wybierz</th></tr></thead>
            <tbody>
              <tr><td>🇵🇱 Polski</td><td>Hej!</td><td><button class="choose-button" data-index="0">Wybierz</button></td></tr>
              <tr><td>🇬🇧 English</td><td>Hello!</td><td><button class="choose-button" data-index="1">Wybierz</button></td></tr>
              <tr><td>🇩🇪 Deutsch</td><td>Hallo!</td><td><button class="choose-button" data-index="2">Wybierz</button></td></tr>
              <tr><td>🇫🇷 Français</td><td>Salut!</td><td><button class="choose-button" data-index="3">Wybierz</button></td></tr>
              <tr><td>🇪🇸 Español</td><td>¡Hola!</td><td><button class="choose-button" data-index="4">Wybierz</button></td></tr>
              <tr><td>🇮🇹 Italiano</td><td>Ciao!</td><td><button class="choose-button" data-index="5">Wybierz</button></td></tr>
            </tbody>
          </table>
        </main>
        <button id="turn-page" class="turn-control turn-forward" type="button">Dalej ➜</button>
      </section>
      <section class="page-face page-back" aria-label="Tył kartki">
        <h1 id="back-title">Magiczna strona ✨</h1>
        <p id="back-description">Tutaj mieszka jednorożec!</p>
        <img class="unicorn" src="https://img2.clipart-library.com/26/transparent-unicorn-clipart/transparent-unicorn-clipart-12.jpg" alt="Kolorowy jednorożec z tęczową grzywą">
        <button id="turn-back" class="turn-control turn-back" type="button">⬅ Wróć</button>
      </section>
    </div>
  </div>
  <footer><span id="visits-label">👀 Odwiedziny strony:</span> <span id="visits">...</span></footer>
  <script>
    const translations = [
      { code:'pl', name:'Polski 🇵🇱', title:'Powitania świata', greeting:'Hej!', change:'Zmień język 🌍', selected:'Wybrany język:', tableLanguage:'Język', tableGreeting:'Powitanie', tableAction:'Wybierz', choose:'Wybierz', visits:'👀 Odwiedziny strony:', next:'Dalej', backTitle:'Magiczna strona ✨', backDescription:'Tutaj mieszka jednorożec!', back:'Wróć' },
      { code:'en', name:'English 🇬🇧', title:'World Greetings', greeting:'Hello!', change:'Change language 🌍', selected:'Selected language:', tableLanguage:'Language', tableGreeting:'Greeting', tableAction:'Choose', choose:'Choose', visits:'👀 Page visits:', next:'Next', backTitle:'Magic page ✨', backDescription:'A unicorn lives here!', back:'Back' },
      { code:'de', name:'Deutsch 🇩🇪', title:'Grüße aus aller Welt', greeting:'Hallo!', change:'Sprache ändern 🌍', selected:'Ausgewählte Sprache:', tableLanguage:'Sprache', tableGreeting:'Begrüßung', tableAction:'Auswählen', choose:'Auswählen', visits:'👀 Seitenaufrufe:', next:'Weiter', backTitle:'Zauberseite ✨', backDescription:'Hier wohnt ein Einhorn!', back:'Zurück' },
      { code:'fr', name:'Français 🇫🇷', title:'Salutations du monde', greeting:'Salut !', change:'Changer de langue 🌍', selected:'Langue choisie :', tableLanguage:'Langue', tableGreeting:'Salutation', tableAction:'Choisir', choose:'Choisir', visits:'👀 Visites de la page :', next:'Suivant', backTitle:'Page magique ✨', backDescription:'Une licorne habite ici !', back:'Retour' },
      { code:'es', name:'Español 🇪🇸', title:'Saludos del mundo', greeting:'¡Hola!', change:'Cambiar idioma 🌍', selected:'Idioma seleccionado:', tableLanguage:'Idioma', tableGreeting:'Saludo', tableAction:'Elegir', choose:'Elegir', visits:'👀 Visitas a la página:', next:'Siguiente', backTitle:'Página mágica ✨', backDescription:'¡Aquí vive un unicornio!', back:'Volver' },
      { code:'it', name:'Italiano 🇮🇹', title:'Saluti dal mondo', greeting:'Ciao!', change:'Cambia lingua 🌍', selected:'Lingua selezionata:', tableLanguage:'Lingua', tableGreeting:'Saluto', tableAction:'Scegli', choose:'Scegli', visits:'👀 Visite della pagina:', next:'Avanti', backTitle:'Pagina magica ✨', backDescription:'Qui vive un unicorno!', back:'Indietro' }
    ];
    const greeting = document.getElementById('greeting');
    const language = document.getElementById('language');
    const table = document.getElementById('language-table');
    const toggle = document.getElementById('change-language');
    const chooseButtons = document.querySelectorAll('.choose-button');
    const card = document.getElementById('page-card');
    function applyLanguage(index) {
      const t = translations[index];
      document.documentElement.lang = t.code;
      document.title = t.title;
      document.getElementById('page-title').textContent = t.title;
      greeting.textContent = t.greeting;
      toggle.textContent = t.change;
      language.textContent = t.selected + ' ' + t.name;
      document.getElementById('table-language').textContent = t.tableLanguage;
      document.getElementById('table-greeting').textContent = t.tableGreeting;
      document.getElementById('table-action').textContent = t.tableAction;
      document.getElementById('visits-label').textContent = t.visits;
      document.getElementById('turn-page').textContent = t.next;
      document.getElementById('back-title').textContent = t.backTitle;
      document.getElementById('back-description').textContent = t.backDescription;
      document.getElementById('turn-back').textContent = t.back;
      chooseButtons.forEach(button => { button.textContent = t.choose; });
      localStorage.setItem('lilabotslab-language', String(index));
    }
    toggle.addEventListener('click', () => {
      const isOpening = table.hidden;
      table.hidden = !isOpening;
      toggle.setAttribute('aria-expanded', String(isOpening));
    });
    chooseButtons.forEach(button => {
      button.addEventListener('click', () => {
        applyLanguage(Number(button.dataset.index));
        table.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.getElementById('turn-page').addEventListener('click', () => card.classList.add('flipped'));
    document.getElementById('turn-back').addEventListener('click', () => card.classList.remove('flipped'));
    const savedLanguage = Number(localStorage.getItem('lilabotslab-language') || 0);
    applyLanguage(Number.isInteger(savedLanguage) && savedLanguage >= 0 && savedLanguage < translations.length ? savedLanguage : 0);
    const key = 'lilabotslab-page-visits';
    const visits = Number(localStorage.getItem(key) || 0) + 1;
    localStorage.setItem(key, visits);
    document.getElementById('visits').textContent = visits;
  </script>
</body>
</html>
