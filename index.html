<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiszki angielskie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Fiszki angielskie 🇬🇧</h1>
    <p class="instruction">Kliknij fiszkę, aby ją odwrócić. Po pokazaniu angielskiego słowa usłyszysz wymowę.</p>

    <section class="cards" aria-label="Fiszki ze słówkami">
      <button class="card" type="button" aria-label="Fiszka: dom">
        <span class="card-inner">
          <span class="card-face card-front">dom</span>
          <span class="card-face card-back">house</span>
        </span>
      </button>

      <button class="card" type="button" aria-label="Fiszka: krzesło">
        <span class="card-inner">
          <span class="card-face card-front">krzesło</span>
          <span class="card-face card-back">chair</span>
        </span>
      </button>

      <button class="card" type="button" aria-label="Fiszka: stół">
        <span class="card-inner">
          <span class="card-face card-front">stół</span>
          <span class="card-face card-back">table</span>
        </span>
      </button>
    </section>
  </main>

  <script>
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const wasFlipped = card.classList.contains('flipped');
        card.classList.toggle('flipped');

        if (!wasFlipped && 'speechSynthesis' in window) {
          const word = card.querySelector('.card-back').textContent.trim();
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(word);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      });
    });
  </script>
</body>
</html>
