<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lego</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#fff;color:#222}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.gallery{height:100vh;height:100svh;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px;overflow:hidden}
.photo-wrap{width:100%;height:auto;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:nowrap}
.nav-button{width:54px;height:54px;padding:0;border:1px solid rgba(255,255,255,.42);border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffd5ec,#e99acb);color:#512746;font-size:2rem;font-weight:400;line-height:1;cursor:pointer;box-shadow:0 5px 18px rgba(233,154,203,.28),inset 0 1px 2px rgba(255,255,255,.8);transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
.nav-button:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 9px 24px rgba(233,154,203,.42)}
.nav-button:active{transform:scale(.96)}
.nav-button:focus-visible{outline:3px solid #512746;outline-offset:5px}
#count{min-width:76px;padding:9px 16px;text-align:center;font-weight:600;font-size:.95rem;letter-spacing:.08em;color:#8a426b;background:#fff0f7;border:1px solid #f0c5dc;border-radius:24px;backdrop-filter:blur(8px)}
@media(max-width:600px){.gallery{padding:8px;gap:8px}.controls{gap:16px}.nav-button{width:44px;height:44px;font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){.nav-button{transition:none}}
</style>
</head>
<body>
<main class="gallery" aria-label="Prezentacja zdjęć">
<div class="photo-wrap"><img id="photo" src="IMG_1217.jpeg" alt="Zdjęcie 1 z 4"></div>
<div class="controls">
<button class="nav-button" id="previous" type="button" aria-label="Poprzednie zdjęcie" title="Poprzednie zdjęcie">‹</button>
<span id="count" aria-live="polite">1 / 4</span>
<button class="nav-button" id="next" type="button" aria-label="Następne zdjęcie" title="Następne zdjęcie">›</button>
</div>
</main>
<script>
(()=>{const images=['IMG_1217.jpeg','IMG_1218.jpeg','IMG_1220.jpeg','IMG_1221.jpeg'];let index=0;
const photo=document.getElementById('photo'),count=document.getElementById('count');
function show(){photo.src=images[index];photo.alt='Zdjęcie '+(index+1)+' z '+images.length;count.textContent=(index+1)+' / '+images.length}
function move(step){index=(index+step+images.length)%images.length;show()}
document.getElementById('previous').addEventListener('click',()=>move(-1));
document.getElementById('next').addEventListener('click',()=>move(1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
})();
</script>
</body>
</html>
