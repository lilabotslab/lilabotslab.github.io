<html lang="pl">
<head>

  <title>Jednorożec 🦄</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0fb,#e9f9ff);color:#6d2f78;text-align:center}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px}h1{margin:0 0 20px;font-size:clamp(2rem,7vw,4rem)}.unicorn{width:min(90vw,520px);max-height:55vh;object-fit:contain;border-radius:24px}footer{width:100%;padding:18px;background:rgba(255,255,255,.75);border-top:1px solid #ead8ed;font-size:1rem}
  </style>
</head>
<body>
  <main>
    <h1>🦄</h1>
    
  </main>
  <footer>👀 Odwiedziny strony: <span id="visits">...</span></footer>
  <script>
    const key='lilabotslab-page-visits';
    const visits=Number(localStorage.getItem(key)||0)+1;
    localStorage.setItem(key,visits);
    document.getElementById('visits').textContent=visits;
