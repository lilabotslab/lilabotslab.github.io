<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiszki angielskie</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);display:grid;place-items:center;padding:24px;color:#111}.app{width:min(92vw,650px);text-align:center}h1{font-size:clamp(1.7rem,5vw,2.5rem);margin:0 0 8px}.sub{color:#666;margin:0 0 24px}.card{height:360px;perspective:1000px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;background:#fff;border-radius:28px;box-shadow:0 18px 50px #0002;display:grid;place-items:center;padding:30px;backface-visibility:hidden}.front{font-size:clamp(2rem,8vw,4rem);font-weight:700}.back{transform:rotateY(180deg);background:#111;color:#fff;display:flex;flex-direction:column;gap:10px}.pl{font-size:clamp(2rem,8vw,3.5rem);font-weight:700}.en{font-size:1.3rem;color:#bbb}.hint{color:#777;margin:16px}.controls{display:flex;justify-content:center;gap:12px}button{border:0;border-radius:12px;padding:11px 20px;font-size:1rem;background:#fff;box-shadow:0 4px 15px #0001;cursor:pointer}.progress{margin-top:14px;color:#777;font-size:.9rem}@media(max-width:600px){.card{height:280px}}</style></head>
<body><main class="app"><h1>Fiszki angielskie</h1><p class="sub">Polsko-angielskie słówka szkolne</p><div class="card" id="card" tabindex="0"><div class="inner"><div class="face front" id="front"></div><div class="face back"><div class="pl" id="pl"></div><div class="en" id="en"></div></div></div></div><p class="hint">Kliknij fiszkę, aby ją odwrócić</p><div class="controls"><button id="prev">← Poprzednia</button><button id="next">Następna →</button></div><div class="progress" id="progress"></div></main>
<script>const words=[['nauczyciel','teacher'],['spodnie','trousers'],['koszulka','T-shirt'],['budynek szkoły','school building'],['biblioteka','library'],['szkoła','school'],['sala gimnastyczna','gym'],['ludzie','people'],['uczeń','student'],['but','shoe'],['pracownia komputerowa','computer room'],['sweter','jumper'],['wstążka','ribbon'],['klasa','class'],['przerwa','break'],['spódnica','skirt'],['krawat','tie'],['dyrektor szkoły','headmaster'],['mundurek szkolny','school uniform'],['klub','club'],['boisko szkolne','schoolyard'],['koszula','shirt'],['plan lekcji','timetable'],['korytarz','hallway'],['kuchnia','kitchen']];let i=0;const card=document.getElementById('card'),front=document.getElementById('front'),pl=document.getElementById('pl'),en=document.getElementById('en'),progress=document.getElementById('progress');function render(){front.textContent=words[i][1];pl.textContent=words[i][0];en.textContent=words[i][1];progress.textContent=`${i+1} / ${words.length}`;card.classList.remove('flip')}function flip(){card.classList.toggle('flip')}function next(){i=(i+1)%words.length;render()}function prev(){i=(i-1+words.length)%words.length;render()}card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.onkeydown=e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()};render();</script></body></html>
