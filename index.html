<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiszki angielskiego — Lila</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }
    .app { width: min(92vw, 520px); text-align: center; }
    h1 { margin: 0 0 22px; font-size: 1.4rem; font-weight: 500; }
    .card {
      width: 100%;
      aspect-ratio: 1.55;
      perspective: 1000px;
      cursor: pointer;
      outline: none;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .55s ease;
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 35px rgba(0,0,0,.12);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      font-weight: 600;
    }
    .back { transform: rotateY(180deg); background: #111; color: white; }
    .hint { margin: 18px 0 0; color: #666; font-size: .95rem; }
    .controls { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
    button {
      border: 0; border-radius: 12px; padding: 10px 18px;
      background: white; color: #111; font-size: 1rem; cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    button:hover { transform: translateY(-1px); }
    .progress { margin-top: 12px; color: #777; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Fiszki angielskiego</h1>

    <div class="card" id="card" tabindex="0" role="button" aria-label="Fiszka. Kliknij, aby odwrócić.">
      <div class="card-inner">
        <div class="face" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>

    <p class="hint">Kliknij fiszkę, aby zobaczyć angielskie słowo</p>
    <div class="controls">
      <button id="prev">← Poprzednia</button>
      <button id="next">Następna →</button>
    </div>
    <div class="progress" id="progress"></div>
  </main>

  <script>
    const words = [
      ['kanapa', 'sofa'],
      ['dom', 'house'],
      ['stół', 'table'],
      ['krzesło', 'chair']
    ];

    let index = 0;
    const card = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    const progress = document.getElementById('progress');

    function render() {
      front.textContent = words[index][0];
      back.textContent = words[index][1];
      progress.textContent = `${index + 1} / ${words.length}`;
      card.classList.remove('flipped');
    }

    function flip() { card.classList.toggle('flipped'); }
    function next() { index = (index + 1) % words.length; render(); }
    function prev() { index = (index - 1 + words.length) % words.length; render(); }

    card.addEventListener('click', flip);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
    document.getElementById('next').addEventListener('click', next);
    document.getElementById('prev').addEventListener('click', prev);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    render();
  </script>
</body>
</html>
