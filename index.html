<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Präsentation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#fff;color:#203b53}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.gallery{height:100vh;height:100svh;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px;overflow:hidden}
.photo-wrap{position:relative;width:100%;height:auto;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;transition:transform .32s ease,opacity .32s ease;perspective:1400px}\n.photo-wrap.turning{transform:perspective(1400px) rotateY(-82deg);opacity:.15}\n@media(prefers-reduced-motion:reduce){.photo-wrap{transition:none}}
#photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
#cover{display:none;width:min(100%,1100px);height:100%;min-height:0;align-items:center;justify-content:center;text-align:center;padding:clamp(20px,5vw,64px);background:linear-gradient(145deg,#f2f8fc 0%,#dcecf6 58%,#c5dfef 100%);border:clamp(7px,1.2vw,14px) solid #6ba6ca;border-radius:18px;box-shadow:0 8px 28px rgba(32,77,105,.14)}
.cover-panel{position:relative;width:100%;padding:clamp(30px,6vw,76px) 18px;background:rgba(255,255,255,.9);border:1px solid #fff;border-radius:12px;box-shadow:0 4px 18px rgba(32,77,105,.08)}
.cover-title{margin:0;color:#214f70;font-size:clamp(2rem,6vw,5rem);font-weight:700;line-height:1.08;letter-spacing:.015em}
.cover-lesson{margin:clamp(18px,3vh,30px) 0 0;color:#477b9a;font-size:clamp(1.1rem,2.8vw,1.8rem);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.cover-number{display:inline-block;margin:clamp(22px,4vh,38px) 0 0;padding:10px 28px;color:#214f70;font-size:clamp(1.6rem,4vw,2.8rem);font-weight:700;letter-spacing:.18em;background:#edf5fa;border:1px solid #d4e6f1;border-radius:8px}
.controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:nowrap}
.nav-button{width:54px;height:54px;padding:0;border:1px solid rgba(255,255,255,.42);border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d8edff,#79b8eb);color:#174d78;font-size:2rem;font-weight:400;line-height:1;cursor:pointer;box-shadow:0 5px 18px rgba(76,148,207,.3),inset 0 1px 2px rgba(255,255,255,.8);transition:transform .2s ease,box-shadow .2s ease}
.nav-button:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 9px 24px rgba(76,148,207,.44)}
.nav-button:active{transform:scale(.96)}
.nav-button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.nav-button:focus-visible{outline:3px solid #214f70;outline-offset:5px}
#count{min-width:76px;padding:9px 16px;text-align:center;font-weight:600;font-size:.95rem;letter-spacing:.08em;color:#286b9f;background:#edf7ff;border:1px solid #b9daf4;border-radius:24px}
@media(max-width:600px){.gallery{padding:8px;gap:8px}.controls{gap:16px}.nav-button{width:44px;height:44px;font-size:1.7rem}#cover{border-radius:12px}.cover-panel{border-radius:10px}}
@media(prefers-reduced-motion:reduce){.nav-button{transition:none}}
</style>
</head>
<body>
<main class="gallery" aria-label="Präsentation">
<div class="photo-wrap">
<section id="cover" aria-label="Titelfolie">
<div class="cover-panel">
<h1 class="cover-title">LEGO Education</h1>
<p class="cover-lesson">Lektion C113</p>
<p class="cover-number">1313</p>
</div>
</section>
<img id="photo" src="Instrukcja01.jpg" alt="Zdjęcie 1 z 6">
</div>
<div class="controls">
<button class="nav-button" id="previous" type="button" aria-label="Vorherige Folie" title="Vorherige Folie">‹</button>
<span id="count" aria-live="polite">1 / 7</span>
<button class="nav-button" id="next" type="button" aria-label="Nächste Folie" title="Nächste Folie">›</button>
</div>
</main>
<script>
(()=>{
const slides=[{type:'cover'},{type:'photo',src:'Instrukcja01.jpg'},{type:'photo',src:'Instrukcja02.jpg'},{type:'photo',src:'Instrukcja03.jpg'},{type:'photo',src:'Instrukcja04.jpg'},{type:'photo',src:'Instrukcja05.jpg'},{type:'photo',src:'Instrukcja06.jpg'}];
let index=0;
const photo=document.getElementById('photo'),cover=document.getElementById('cover'),count=document.getElementById('count');
const previous=document.getElementById('previous'),next=document.getElementById('next');
function show(){
 const slide=slides[index],isCover=slide.type==='cover';
 cover.style.display=isCover?'flex':'none';
 photo.style.display=isCover?'none':'block';
 if(!isCover){photo.src=slide.src;photo.alt='Zdjęcie '+index+' z '+(slides.length-1)}
 count.textContent=(index+1)+' / '+slides.length;
 previous.disabled=index===0;
 next.disabled=index===slides.length-1;
 previous.setAttribute('aria-disabled',String(previous.disabled));
 next.setAttribute('aria-disabled',String(next.disabled));
}
function move(step){const target=index+step;if(target<0||target>=slides.length||turning)return;\n const wrap=document.querySelector('.photo-wrap');\n if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){index=target;show();return}\n turning=true;wrap.classList.add('turning');\n window.setTimeout(()=>{index=target;show();wrap.classList.remove('turning');window.setTimeout(()=>{turning=false},330)},320)\n}
document.getElementById('previous').addEventListener('click',()=>move(-1));
document.getElementById('next').addEventListener('click',()=>move(1));
document.addEventListener('keydown',e=>{
 const target=e.target;
 if(target && (target.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target.tagName)))return;
 if(['ArrowLeft','ArrowRight','PageUp','PageDown',' ','Home','End'].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1);
 else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')move(1);
 else if(e.key==='Home'){index=0;show()}
 else if(e.key==='End'){index=slides.length-1;show()}
},true);
show();
})();
</script>
</body>
</html>
